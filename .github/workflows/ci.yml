name: CI

on: 
  push: 
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with: 
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        pip install -r requirements.txt
      
    - name: Lint with Ruff
      run: |
        ruff --version
        ruff check .
    
    - name: Basic script import / help checks
      run: |
        python open_cv_circle_annotation.py --help || true
        python predict.py --help || true
        python predict_tensor_rt.py --help || true
        python train.py --help || true

    # ----------------------------
    # Dataset setup
    # ----------------------------
    - name: Unzip sample data
      run: |
        if [ -f data/red_circle_example.zip ]; then
          mkdir -p data/red_circle_example
          unzip -o data/red_circle_example.zip -d data/red_circle_example
        fi

    - name: List sample data
      run: |
        echo "data:"
        ls -R data/red_circle_example || true   

    # ----------------------------
    # Tiny training (CI smoke test)
    # ----------------------------
    - name: Train YOLO via train.py (5 epochs, CPU)
      run: |
        python -c "from train import train_script; train_script(model_path='models/yolo11n.pt', data_yaml='data/red_circle_example/data.yaml', epochs=5, imgsz=640, batch=2, device='cpu', workers=0, fraction=0.1, project='runs', name='ci_train', exist_ok=True, plots=False, interactive=False)"

    # ----------------------------
    # Tiny inference
    # ----------------------------
    - name: Run inference on 5 images
      run: |
        mkdir -p data/red_circle_example/infer_subset
        ls data/red_circle_example/test/images | head -n 5 | while read img; do
          cp data/red_circle_example/test/images/$img data/red_circle_example/infer_subset/
        done

        yolo predict \
          model=runs/detect/train/weights/best.pt \
          source=data/red_circle_example/infer_subset \
          imgsz=640 \
          save=True

    # ----------------------------
    # Artifacts
    # ----------------------------
    - name: Upload artifacts (training + inference)
      uses: actions/upload-artifact@v4
      with:
        name: ci-yolo-results
        path: |
          runs/
          data/red_circle_example/infer_subset/
        if-no-files-found: error